:root {
  --bg: #05080f;
  --surface: #0a0f1c;
  --surface-2: #0d1424;
  --line: #1c2942;
  --line-soft: #141f36;
  --gold: #ffd24a;
  --gold-dim: #b8932e;
  --ink: #e8e2cf;
  --ink-dim: #8b93a7;
  --cyan: #7fd4c1;
  --rose: #e08a7f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #05080f;
    --surface: #0a0f1c;
    --surface-2: #0d1424;
    --line: #1c2942;
    --line-soft: #141f36;
    --gold: #ffd24a;
    --gold-dim: #b8932e;
    --ink: #e8e2cf;
    --ink-dim: #8b93a7;
    --cyan: #7fd4c1;
    --rose: #e08a7f;
  }
}
html {
  background: var(--bg);
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
.blueprint-grid {
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px),
    linear-gradient(rgba(255, 210, 74, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 210, 74, 0.045) 1px, transparent 1px);
  background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px;
}
@keyframes dashmove {
  to {
    stroke-dashoffset: -28;
  }
}
.flow-line {
  stroke-dasharray: 7 7;
  animation: dashmove 1.6s linear infinite;
}
@keyframes pulseGold {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}
.pulse-dot {
  animation: pulseGold 1.8s ease-in-out infinite;
}
::-moz-selection {

}
