  font-size: 13px;
}
.text-lg {
  font-size: 1.125rem;
  line-height: 1.75rem;
}
.text-sm {
  font-size: 0.875rem;
  line-height: 1.25rem;
}
.text-xl {
  font-size: 1.25rem;
  line-height: 1.75rem;
}
.text-xs {
  font-size: 0.75rem;

}
.font-bold {
  font-weight: 700;
}
.font-normal {
  font-weight: 400;
}
.leading-relaxed {
  line-height: 1.625;
}
.leading-tight {
  line-height: 1.25;
}
.tracking-wide {
  letter-spacing: 0.025em;
}
.tracking-wider {
  letter-spacing: 0.05em;
}
.tracking-widest {
  letter-spacing: 0.1em;
}
.text-\[var\(--ink\)\] {

}
.text-\[var\(--ink-dim\)\] {
  color: var(--ink-dim);
}
.text-\[var\(--ink-faint\)\] {
  color: var(--ink-faint);
}
.text-\[var\(--primary\)\] {
  color: var(--primary);
}
.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

  text-decoration-line: underline;
}

}

:root {
  --bg: #07090d;
  --surface: #0c1017;
  --surface-2: #111722;
  --surface-3: #161e2d;
  --line: #22304a;
  --line-soft: #182238;
  --ink: #d7e0ee;
  --ink-dim: #8494ad;
  --ink-faint: #55637c;
  --primary: #e8b33c;
  --flow-in: #22d3ee;
  --flow-work: #f5b83d;
  --flow-out: #34d399;
  --flow-mem: #a78bfa;
  --lvl-3: #f87171;
  --lvl-9: #fb923c;
  --lvl-27: #facc15;
  --lvl-81: #4ade80;
  --lvl-243: #38bdf8;
  --lvl-729: #c084fc;
  --danger: #fb7185;
  --safe-area-inset-top: 0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #07090d;
    --surface: #0c1017;
    --surface-2: #111722;
    --surface-3: #161e2d;
    --line: #22304a;
    --line-soft: #182238;
    --ink: #d7e0ee;
    --ink-dim: #8494ad;
    --ink-faint: #55637c;
    --primary: #e8b33c;
  }
}
html {
  background: var(--bg);
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  -webkit-font-smoothing: antialiased;
}
::-moz-selection {
  background: rgba(232, 179, 60, 0.35);
  color: #fff;
}
::selection {
  background: rgba(232, 179, 60, 0.35);
  color: #fff;
}
.kartor-scroll::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
.kartor-scroll::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 4px;
}
.kartor-scroll::-webkit-scrollbar-track {
  background: transparent;
}
@keyframes pulse-node {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}
.node-pulse {
  animation: pulse-node 1.6s ease-in-out infinite;
}
@keyframes scanline {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(240%);
  }
}
.scan-beam {
  animation: scanline 1.1s ease-in-out infinite;
}
@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.fade-up {
  animation: fade-up 0.35s ease both;
}

}

}
.hover\:text-\[var\(--ink\)\]:hover {
  color: var(--ink);
}

}
