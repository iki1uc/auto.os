  --surface: #0a0f1c;
  --surface-2: #0d1526;
  --line: #1c2a45;
  --ink: #d7e3ff;
  --ink-dim: #7d8fb3;
  --gold: #ffd24a;
  --gold-dim: #8a6d1f;
  --red: #ff3b30;
  --blue: #2f7bff;
  --green: #2eff8a;
  --violet: #b26bff;

  :root {
    --bg: #05080f;
    --surface: #0a0f1c;
    --surface-2: #0d1526;
    --line: #1c2a45;
    --ink: #d7e3ff;
    --ink-dim: #7d8fb3;
    --gold: #ffd24a;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  margin: 0;
  padding: 0;
}
* {
  box-sizing: border-box;
}
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--surface);
}
::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--gold-dim);
}
@keyframes pulseGlow {
  0%, 100% {
    opacity: 0.55;
  }
  50% {
    opacity: 1;
  }
}
@keyframes blinkCaret {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}
@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes dashMove {
  to {
    stroke-dashoffset: -28;
  }
}
@keyframes spinSlow {
  to {
    transform: rotate(360deg);
  }
}
.anim-rise {
  animation: riseIn 0.35s ease both;
}
.caret-blink {
  animation: blinkCaret 1.1s steps(1) infinite;
}
.corridor-flow {
  animation: dashMove 1.2s linear infinite;
}
.wabern-spin {
  animation: spinSlow 3.4s linear infinite;
  transform-origin: center;
}

  font-family: var(--mono);
}
.checkbox-alpha {
  -webkit-appearance: none;
  -moz-appearance: none;
       appearance: none;
